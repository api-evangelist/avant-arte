aid: avant-arte
name: Avant Arte
description: >-
  Avant Arte is a global online art marketplace for discovering and collecting
  limited edition prints, sculptures and digital works produced in close
  collaboration with leading contemporary artists. Founded in the Netherlands,
  the platform works directly with 250+ artists on exclusive editions and
  release "draws", offering authentication, custom framing, gift cards, and
  expert collector support. It surfaced in the API Evangelist network as a
  portfolio company of Bessemer Venture Partners and Prosus Ventures in the
  marketplaces sector. Avant Arte does not publish a public developer API; this
  profile has been enriched from its public web, security, and organizational
  surfaces.
